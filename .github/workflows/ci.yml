name: CI & Migrations

on:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - 'v*' # Triggers on release tags (e.g., v1.0.0, v2.1.3)
  workflow_dispatch:
    inputs:
      confirm_production_migration:
        description: Confirm applying pending Prisma migrations to Supabase
        type: choice
        options:
          - skip
          - migrate
        default: skip
        required: true

permissions:
  contents: read

jobs:
  validate:
    name: Migrate, Test, and Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/keydrop?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: keydrop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d keydrop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate --config prisma7.config.ts

      - name: Generate Prisma client
        run: npx prisma generate --config prisma7.config.ts

      - name: Apply migrations to local CI test database
        run: npx prisma migrate deploy --config prisma7.config.ts

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build

  create-release-pr:
    name: Create Pull Request from Release Tag
    # Runs when a version tag (v*) is pushed and validation succeeds
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Create pull request to master
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: master
          branch: release/${{ github.ref_name }}
          title: 'Release ${{ github.ref_name }} to master'
          body: 'This pull request syncs the changes from release tag `${{ github.ref_name }}` to `master`.'

  production-migrate:
    name: Apply Production Migrations to Supabase
    # Runs when a 'v*' tag is pushed OR manually via workflow_dispatch when 'migrate' is selected
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm_production_migration == 'migrate')
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Supabase database URL secret
        run: test -n "$DATABASE_URL"

      - name: Apply migrations to Supabase via Prisma
        run: npx prisma migrate deploy --config prisma7.config.ts

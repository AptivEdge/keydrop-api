name: CI & Migrations

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    tags:
      - 'v*' # Triggers on release tags (e.g., v1.0.0, v2.1.3)

permissions:
  contents: read

jobs:
  validate:
    name: Migrate, Test, and Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/keydrop?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: keydrop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d keydrop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate --config prisma7.config.ts

      - name: Generate Prisma client
        run: npx prisma generate --config prisma7.config.ts

      - name: Apply migrations to local CI test database
        run: npx prisma migrate deploy --config prisma7.config.ts

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build

  create-release-pr:
    name: Create Pull Request from Release Tag
    # Runs when a version tag (v*) is pushed and validation succeeds
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Push tagged commit and create pull request to master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          branch="release/${RELEASE_TAG}"
          git push origin "${RELEASE_SHA}:refs/heads/${branch}"

          existing_pr="$(gh pr list --base master --head "${branch}" --state open --json number --jq '.[0].number // empty')"
          if [ -n "${existing_pr}" ]; then
            echo "Pull request #${existing_pr} already exists."
          else
            gh pr create \
              --base master \
              --head "${branch}" \
              --title "Release ${RELEASE_TAG} to master" \
              --body "This pull request syncs the changes from release tag \`${RELEASE_TAG}\` to \`master\`."
          fi

  production-migrate:
    name: Apply Production Migrations to Supabase
    # Runs only after a pull request is merged into master.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'master'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Supabase database URL secret
        run: test -n "$DATABASE_URL"

      - name: Apply migrations to Supabase via Prisma
        run: npx prisma migrate deploy --config prisma7.config.ts

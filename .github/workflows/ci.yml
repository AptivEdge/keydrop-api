name: CI

on:
  pull_request:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      confirm_production_migration:
        description: Confirm applying pending migrations to the production database
        type: choice
        options:
          - skip
          - migrate
        default: skip
        required: true

permissions:
  contents: read

jobs:
  validate:
    name: Migrate, test, and build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/keydrop?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: keydrop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d keydrop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # (Optional) If you still want to validate or test with Prisma locally in CI:
      - name: Apply migrations to CI database (Prisma or Supabase test)
        run: npx prisma migrate deploy --config prisma7.config.ts

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build

  production-migrate:
    name: Apply production migrations to Supabase
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_production_migration == 'migrate'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # 1. Set up the Supabase CLI
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      # 2. Link your Supabase project using an Access Token and Project Reference
      - name: Link Supabase Project
        run: supabase link --project-ref gihoxmacletkytkzibsy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # 3. Push migrations natively via Supabase CLI
      - name: Push migrations to Supabase
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}

services:
  db:
    image: postgres:15-alpine
    ports:
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: keydrop
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d keydrop']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
